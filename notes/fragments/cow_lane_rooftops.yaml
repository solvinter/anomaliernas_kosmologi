notes: >
  Fragmentet visar den första verkliga skalningsfrågan för Cow Lane.
  Noden har processorer och efterfrågan på compute men saknar tillräcklig
  solyta. Lösningen kommer inte från ledningen utan från en yngre lärling
  som ser taken i grannskapet som ett distribuerat energisystem.
  Affärsmodellen föds tillsammans med en etisk regel: hushållen får
  stabil elektricitet först och compute använder endast överskottet.
  Scenen bör göra tydligt att Solvinter inte bara expanderar över staden
  utan gör grannarna till deltagare i samma infrastruktur.
