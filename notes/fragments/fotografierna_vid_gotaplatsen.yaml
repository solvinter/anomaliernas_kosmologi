notes: >
  Fragmentet ska utga fran den konkreta erfarenheten av analogt fotografi:
  kuvertet, negativremsorna, papperskopiornas lukt och bilderna pa
  koksbordet. Den filosofiska fragan far aldrig presenteras som en
  utlaggning om medvetande eller kvantfysik. Den ska uppsta ur
  protagonistens oformaga att avgora om fotografierna avslojade en
  illusion eller bevarade nagot som hans vanliga perception inte hade
  kunnat se. Fotografierna fungerar senare som centralt material i
  arkivet som skapas nar anteckningar, bilder och andra spar sorteras i
  kallaren i Majorna.
