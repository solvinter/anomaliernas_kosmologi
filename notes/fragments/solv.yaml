  kring noderna, deras estetik, ritualer och sätt att organisera arbete.

  Systemet får inte framställas som en färdig utopisk valuta. Det börjar

  som ett konkret svar på att vanliga pengar inte registrerar många av

  de handlingar som håller en plats och dess människor vid liv.

