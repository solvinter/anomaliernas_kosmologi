notes: >

  Blackrocks är platsen för den första fullskaliga Solvinter-noden.

  Mumford är den närliggande byn och den levande sociala miljö som

  föregår och formar noden. Saxa Recentia är ännu inget uttalat program.

  Den växer fram genom återkommande byggpraktiker, estetiska beslut,

  gemensamma måltider och respekt för både lokal och inflyttad kunskap.

  Först långt senare får denna ordning sitt historiska namn.

