core_philosophy:
  anomalies:
    principle: >
      An anomaly is first an observation that does not fit the map.
      It is not automatically false, true, supernatural, pathological or revolutionary.
    kuhnian_pressure: >
      First the deviation is treated as error. Then more deviations appear.
      Eventually the map begins to look stranger than the terrain.

  secrets:
    principle: >
      A secret builds a locked room in consciousness. Other things get trapped there too:
      shame, memory, questions and sometimes whole parts of a person.
    ethical_direction: "Transparency is ventilation for truth, especially around children."

  diagnosis:
    principle: >
      A diagnosis can describe risk and pattern, but it can also become a map that hides
      the person when the system stops looking.

  society:
    principle: >
      Many people called anomalous are only anomalous in rooms built for the wrong human being.

  solvinter:
    principle: >
      Technology matters only when it builds places where human beings can become more possible.

rendering_rule: >
  Philosophy should usually appear through scenes, questions, practical decisions
  and human stakes rather than as essay.
