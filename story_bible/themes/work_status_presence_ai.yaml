material_that_does_not_fit_cleanly:
  - material: "production/authoring_method.md och production/creative_contract.md"
    reason: >
      De berör AI och arbete, men som produktionens arbetsdelning snarare än
      romanens värld. Bör inte blandas ihop med Solvinter-temat utan märkning.
  - material: "notes/fragments/raw/i_vaxthusets_skymning_2"
    reason: >
      Har stark tematisk relevans men är tekniskt tungt och riskerar att dra
      romanen mot kryptomanifest om det används för direkt.
  - material: "notes/fragments/windey_bay_ii.yaml"
    reason: >
      Innehåller tydlig resonant ekonomi, men formen är mycket framtidsarkivisk
      och kan dominera om den läses som facit.
  - material: "notes/fragments/blackrocks.md och fadern_blackrocks.yaml"
    reason: >
      Har stark koppling till egendom, arbete och status, men handlar också om
      familjerelation och platsens poesi. Bör inte reduceras till ekonomiskt tema.
  - material: "notes/fragments/de_forsta_anomalierna.md/.yaml"
    reason: >
      Dolda kompetenser och arbetsvärde är tydliga, men fragmentet kan störa
      den realistiska bågen om anomalierna kommer för tidigt i romanen.
  - material: "passiv inkomst"
    reason: >
      Temat är viktigt i frågeställningen men finns ännu mer som ekonomisk
      horisont, likviditet, ägande och Solvinterflöde än som konkret scenmaterial.

