meta:
  created: "2026-08-07"
  status: "thematic_map"
  scope:
    - "notes/fragments/"
    - "manus/"
    - "output/manus/"
    - "manuscript/"
    - "story_bible/"
    - "production/"
  method: >
    Kartan bygger på sökning och närläsning av fragment, romanversioner,
    läsutgåvor, story bible och produktionsdokument. Den ska inte bevisa en
    tes, utan visa vilket befintligt material som redan kan bära ett större
    tema om arbete, status, passivitet, närvaro, teknologi och människovärde.
  cautions:
    - "Skilj mellan romanens material och produktionens meta-material."
    - "Bevara motsägelser: arbete framträder både som autonomi, exploatering, identitet och frånvaro."
    - "Passiv inkomst finns som tydligt motiv först genom Solvinter, pengar, valuta och värdecirkulation; det är inte lika etablerat som arbete/utanförskap."
  audit:
    notes_fragment_files_seen: 198
    candidate_files_with_theme_keywords_seen: 231
    connected_fragment_entries: 66

core_theme:
  name: "Arbete, status, närvaro och människovärde i automationens tid"
  formulation: >
    Materialet rör sig mellan ett samhälle där arbete ger namn, kropp, rytm,
    status och social legitimitet, och en möjlig framtid där mänskligt värde
    inte längre kan bindas till lönearbete eller produktivitetsmått. Romanens
    starkaste material visar vad som händer när en människa faller ur arbetets
    ordning, och vad som kan uppstå när närvaro, hantverk, omsorg och lärande
    börjar räknas som verkliga former av värde.
  evidence_quality: "starkt men ojämnt"
  notes: >
    Temat finns starkast i Betelskeppet, sjukhuset, Fältet, återgången till
    arbete, Cow Lane, Mumford och Solvinter-ekonomin. Det är ännu inte fullt
    sammanfogat till en medveten filosofisk linje i romanen, men materialet
    pekar tydligt dit.

possible_underlying_message:
  - claim: >
      En människa förlorar inte sitt värde när hon förlorar sitt arbete, men
      samhället saknar ofta språk, platser och ekonomiska modeller för att se
      henne då.
    confidence: "high"
  - claim: >
      Arbete kan vara en form av stolthet och autonomi när det bygger kompetens,
      ansvar och verkligt sammanhang, men en form av våld när det reducerar
      människan till prestation, status eller nyttokropp.
    confidence: "high"
  - claim: >
      AI och automation gör inte människan överflödig i materialet; de tvingar
      snarare fram frågan om vilka mänskliga handlingar som borde räknas när
      lönearbete inte längre är den enda värdebäraren.
    confidence: "medium"
  - claim: >
      Närvaro, lärande, reparerande, odling, samtal och omsorg kan bli en
      ny värdeform, men samma mätning kan också bli övervakning om den görs
      utan etik.
    confidence: "medium"

historical_movement:
  status: "latent snarare än färdigformulerad"
  summary: >
    Den föreslagna historiska rörelsen finns delvis i materialet, men inte som
    en explicit essä. Romanen har redan de konkreta scenerna: kroppen i arbete,
    yrket som namn, arbetslöshet som skam, bidrag som passiviserande kategori,
    pengar som frihet, och Solvinter som möjlig post-work-struktur.
  steps:
    - step: 1
      movement: "arbete som fysisk nödvändighet"
      material_status: "explicit i Ghana-, Peta- och kustfragmenten; implicit i kranarna"
      supporting_material:
        - file: "notes/fragments/ateruppbyggnad_05"
          fragment_id: "ateruppbyggnad_05"
          connection_type: "explicit"
          contribution: "Kroppsligt arbete i fiskeby, båtar, nät, material och vardagens fysiska villkor."
        - file: "notes/fragments/mason_peta"
          fragment_id: "peta"
          connection_type: "explicit"
          contribution: "Muraryrket och hantverkets precision som kunskap och stolthet."
        - file: "notes/fragments/kranarnas_själ"
          fragment_id: "kranarnas_sjal"
          connection_type: "implicit"
          contribution: "Industrins kropp finns kvar som former när arbetet har försvunnit."
    - step: 2
      movement: "arbetarrörelsens omvandling av arbete till stolthet och rättighet"
      material_status: "svagt explicit, starkt möjligt genom skepparen, facket och hantverkarna"
      supporting_material:
        - file: "output/manus/anomaliernas_kosmologi_kortroman_lasutgava_v0_8.md"
          fragment_id: null
          connection_type: "implicit"
          contribution: "Skepparen får värdighet genom kunnande, facklig erfarenhet och praktisk heder snarare än status."
    - step: 3
      movement: "yrket som modern identitet och status"
      material_status: "explicit"
      supporting_material:
        - file: "notes/fragments/upplosning"
          fragment_id: "upplosning"
          connection_type: "explicit"
          contribution: "När arbetet försvinner försvinner också namn, hem, ekonomi och social position."
        - file: "notes/fragments/vantrummet"
          fragment_id: "vantrummet"
          connection_type: "explicit"
          contribution: "Läkarrollen återkommer som både yrke, etik och riskfylld identitet."
    - step: 4
      movement: "arbetslöshet som socialt stigma"
      material_status: "explicit i gatan/Fältet, implicit i sjukhuspassiviteten"
      supporting_material:
        - file: "notes/fragments/gatran"
          fragment_id: "gatan"
          connection_type: "implicit"
          contribution: "Människan utan plats rör sig utanför stadens ekonomi och framtid."
        - file: "notes/fragments/resonansen"
          fragment_id: "resonansen"
          connection_type: "explicit"
          contribution: "Diagnoser, journaler och försörjningsstöd samlar människor i en social efterklang."
    - step: 5
      movement: "förmögenhet som rätt till fritid"
      material_status: "svagt direkt, starkare genom faderns status och BlackRocks"
      supporting_material:
        - file: "notes/fragments/fadern_blackrocks.yaml"
          fragment_id: "fadern_blackrocks"
          connection_type: "implicit"
          contribution: "Fadern bär en äldre klassordning där status, hushåll, mark och rätt att bli betjänad hänger samman."
        - file: "notes/fragments/blackrocks.md"
          fragment_id: "blackrocks"
          connection_type: "implicit"
          contribution: "Mark, hus och kust blir både frukt av arbete och arena för statuskonflikt."
    - step: 6
      movement: "passiv inkomst som högstatusversion av icke-arbete"
      material_status: "ännu mest antytt"
      supporting_material:
        - file: "notes/fragments/raw/likviditet"
          fragment_id: "likviditet"
          connection_type: "explicit"
          contribution: "Frihet definieras som hur långt in i framtiden en människa har råd att tänka."
        - file: "notes/fragments/visionen_vid_vagskalet"
          fragment_id: "visionen_vid_vagskalet"
          connection_type: "implicit"
          contribution: "Pengar börjar framträda som infrastruktur för arbete som ännu inte blivit färdigt."
    - step: 7
      movement: "AI och automation gör mänskligt arbete mindre självklart"
      material_status: "explicit i Solvinter-filerna"
      supporting_material:
        - file: "story_bible/solvinter/economy.yaml"
          fragment_id: null
          connection_type: "explicit"
          contribution: "AI-transformationen behöver lokal kompetens; människor bygger, underhåller och vidareutvecklar systemen."
        - file: "manuscript/fragments/solvinter-brodern-ekonomi.md"
          fragment_id: "solvinter-brodern-ekonomi"
          connection_type: "explicit"
          contribution: "Cow Lane kopplas till globalt AI-arbete, utbildning och självständig teknisk kompetens."
    - step: 8
      movement: "post-work-konflikten: människovärde efter produktivitet"
      material_status: "tydligt men litterärt ofärdigt"
      supporting_material:
        - file: "notes/fragments/raw/faltets_valuta2"
          fragment_id: "faltets_valuta2"
          connection_type: "explicit"
          contribution: "Bidrag omformas till rytm, deltagande och värde i ett system där närvaro räknas."
        - file: "notes/fragments/proof_of_vitality"
          fragment_id: "proof_of_vitality"
          connection_type: "explicit"
          contribution: "Vitalitet och deltagande blir mätbara, men riskerar samtidigt att bli kontroll."

major_contrasts:
  - contrast: "arbete - fattig"
    summary: "Arbete framträder inte alltid som väg ut ur fattigdom; ibland är det bara överlevnad under hårda villkor."
    examples:
      - file: "notes/fragments/ateruppbyggnad_05"
        connection_type: "explicit"
        contribution: "Kustens arbete är kroppsligt, lokalt och nödvändigt."
      - file: "notes/fragments/vaxthuset"
        connection_type: "explicit"
        contribution: "Omsorgsarbete förbrukar kroppen utan att garantera trygghet."
  - contrast: "arbete - framgångsrik"
    summary: "Yrket kan ge återkomst, status och namn, men också skapa beroende av prestation."
    examples:
      - file: "notes/fragments/vantrummet"
        connection_type: "explicit"
        contribution: "Läkaryrket ger handlingskraft och etisk auktoritet."
      - file: "notes/fragments/innan_alllt"
        connection_type: "explicit"
        contribution: "Arbete och träning liknar socialt godkända beroenden."
  - contrast: "fritid - förmögen"
    summary: "Fritid som självvald frihet är kopplad till pengar, mark, rörlighet och tidshorisont."
    examples:
      - file: "notes/fragments/raw/likviditet"
        connection_type: "explicit"
        contribution: "Likviditet gör framtiden tänkbar."
      - file: "notes/fragments/blackrocks.yaml"
        connection_type: "implicit"
        contribution: "Mark och hus blir frihetsobjekt men också familjekonflikt."
  - contrast: "fritid - arbetslös"
    summary: "Fritid utan ekonomisk och social legitimitet blir inte frihet utan skam, väntan och osynlighet."
    examples:
      - file: "notes/fragments/kroppen_som_blev_kvar2"
        connection_type: "explicit"
        contribution: "Utskrivningen lämnar kroppen i en väntansrytm utan låsta dörrar."
      - file: "notes/fragments/gatran"
        connection_type: "implicit"
        contribution: "Gatans tid saknar produktiv riktning."
  - contrast: "bidrag - beroende"
    summary: "Bidrag och försörjningsstöd visar både nödvändig omsorg och en kategori som kan passivisera."
    examples:
      - file: "notes/fragments/resonansen"
        connection_type: "explicit"
        contribution: "Människor ordnas genom diagnoser, journaler och försörjningsstöd."
      - file: "notes/fragments/raw/den_levande_kedjan"
        connection_type: "explicit"
        contribution: "Socialbidrag omformas till basvärde i en levande kedja."
  - contrast: "passiv inkomst - frihet"
    summary: "Pengar kan befria arbete från akut överlevnad, men temat behöver utvecklas försiktigt för att inte bli manifest."
    examples:
      - file: "notes/fragments/visionen_vid_vagskalet"
        connection_type: "implicit"
        contribution: "Värde börjar synas i hur människor tar i pengar och arbete som ännu inte är färdigt."
      - file: "notes/fragments/raw/likviditet"
        connection_type: "explicit"
        contribution: "Pengar skapar förmågan att tänka längre än nästa dag."
  - contrast: "Betelskeppet - utanförskap"
    summary: "Skeppet är platsen där människor står utanför samhällets produktiva ordning men ännu är levande bärare av erfarenhet."
    examples:
      - file: "notes/fragments/skeppets_buk"
        connection_type: "explicit"
        contribution: "Skeppet fungerar som underjordiskt socialt rum och symbolisk buk."
      - file: "notes/fragments/kranarnas_själ"
        connection_type: "implicit"
        contribution: "Kranarna binder utanförskapet till ett försvunnet industriellt arbete."
  - contrast: "Fältet - närvaro"
    summary: "Fältet föreslår en mänsklig ordning där närvaro, rutiner och relationer ersätter krav på prestation."
    examples:
      - file: "notes/fragments/ordningen"
        connection_type: "explicit"
        contribution: "Frivillig ordning blir motsats till institutionsdisciplin."
      - file: "notes/fragments/faltet"
        connection_type: "explicit"
        contribution: "Arbete utan lönearbete blir ett sätt att återvinna värdighet."
  - contrast: "sjukhuset - passivitet"
    summary: "Sjukhuset arbetar intensivt som institution, men patienten placeras i väntan och kroppslig stillhet."
    examples:
      - file: "notes/fragments/avdelningen"
        connection_type: "explicit"
        contribution: "Vårdavdelningens ritualer ger både skydd och passivitet."
      - file: "notes/fragments/kroppen_som_blev_kvar2"
        connection_type: "explicit"
        contribution: "Kroppen fortsätter följa institutionens rytm efter utskrivning."
  - contrast: "Cow Lane - arbete som kompetens och autonomi"
    summary: "Cow Lane förvandlar arbete från anställning/status till reparerbar kompetens, lärande och lokal kontroll."
    examples:
      - file: "notes/fragments/cow_lane_rooftops.yaml"
        connection_type: "explicit"
        contribution: "Varnar för passiva takuthyrare och prioriterar lokal kompetens."
      - file: "notes/fragments/fro_for_mumfordnoden"
        connection_type: "explicit"
        contribution: "AI-stöd kopplas till utbildning, livsval, arbete och småföretag."
  - contrast: "Solvinter - automation och post-work"
    summary: "Solvinter antyder ett system där produktivitet kan skiljas från individuellt lönearbete utan att människan blir irrelevant."
    examples:
      - file: "story_bible/solvinter/economy.yaml"
        connection_type: "explicit"
        contribution: "Ekonomi byggs kring kompetens som blir kvar lokalt."
      - file: "notes/fragments/proof_of_vitality"
        connection_type: "explicit"
        contribution: "Närvaro och vitalitet kan mätas, men etiskt riskabelt."

locations_and_their_symbolic_functions:
  - location: "Betelskeppet"
    symbolic_function: >
      Underjord, buk, tillfällig fristad och slutpunkt för den människa som
      fallit ur namn, yrke, bostad och ekonomi. Det är inte bara misär utan
      också ett arkiv av människor som systemet inte längre läser.
    connections:
      - file: "notes/fragments/skeppets_buk"
        fragment_id: "skeppets_buk"
        connection_type: "explicit"
      - file: "notes/fragments/kranarnas_själ"
        fragment_id: "kranarnas_sjal"
        connection_type: "implicit"
      - file: "output/manus/anomaliernas_kosmologi_kortroman_lasutgava_v0_8.md"
        fragment_id: null
        connection_type: "explicit"
  - location: "kranarna och hamnen"
    symbolic_function: >
      Kvarlämnad arbetarkropp i stadens landskap. Maskinerna har fortfarande
      form, riktning och själ, men deras arbete har blivit historiskt minne.
    connections:
      - file: "notes/fragments/kranarnas_själ"
        fragment_id: "kranarnas_sjal"
        connection_type: "explicit"
      - file: "notes/fragments/morgonljusets_folk"
        fragment_id: "morgonljusets_folk"
        connection_type: "implicit"
  - location: "sjukhuset"
    symbolic_function: >
      Institutionell aktivitet som producerar passivitet i patienten: rond,
      medicin, måltider, väntan och kroppslig avlämning.
    connections:
      - file: "notes/fragments/avdelningen"
        fragment_id: "avdelningen"
        connection_type: "explicit"
      - file: "notes/fragments/kroppen_som_blev_kvar2"
        fragment_id: "kroppen_som_blev_kvar"
        connection_type: "explicit"
  - location: "Fältet"
    symbolic_function: >
      Plats där värde inte först uppstår genom anställning utan genom rytm,
      rutiner, odling, samtal och förmågan att bli kvar utan att försvinna.
    connections:
      - file: "notes/fragments/platsen"
        fragment_id: "platsen"
        connection_type: "explicit"
      - file: "notes/fragments/faltet"
        fragment_id: "marcus_pipa"
        connection_type: "explicit"
      - file: "notes/fragments/vaxthuset"
        fragment_id: "vaxt_huset"
        connection_type: "explicit"
  - location: "vårdcentralen"
    symbolic_function: >
      Återgång till yrkesidentitet, men också etiskt gränsland: läkaren har
      varit patient, den hjälpande kroppen har själv varit hjälplös.
    connections:
      - file: "notes/fragments/vantrummet"
        fragment_id: "vantrummet"
        connection_type: "explicit"
      - file: "notes/fragments/mellan_olika verkligheter 2"
        fragment_id: null
        connection_type: "explicit"
  - location: "Cow Lane"
    symbolic_function: >
      Första praktiska noden där arbete blir kompetens, autonomi och byggbar
      framtid snarare än bara anställning.
    connections:
      - file: "notes/fragments/cow_lane_rooftops.yaml"
        fragment_id: "cow_lane_rooftops"
        connection_type: "explicit"
      - file: "notes/fragments/den_bortglomda_skatten"
        fragment_id: "den_bortglomda_skatten"
        connection_type: "implicit"
      - file: "manuscript/fragments/solvinter-brodern-ekonomi.md"
        fragment_id: "solvinter-brodern-ekonomi"
        connection_type: "explicit"
  - location: "Mumford"
    symbolic_function: >
      Platsen där läxhjälp, AI-stöd, lokala företag, maker space och social
      infrastruktur kan visa värde före status.
    connections:
      - file: "notes/fragments/fro_for_mumfordnoden"
        fragment_id: null
        connection_type: "explicit"
      - file: "notes/fragments/fro_om_laxhjalp"
        fragment_id: null
        connection_type: "explicit"
  - location: "BlackRocks"
    symbolic_function: >
      Paradis, egendom, arbete och konflikt: huvudpersonen har arbetat fram
      platsen, men faderns statusordning hotar att göra sonens arbete osynligt.
    connections:
      - file: "notes/fragments/blackrocks.md"
        fragment_id: "blackrocks"
        connection_type: "explicit"
      - file: "notes/fragments/fadern_blackrocks.yaml"
        fragment_id: "fadern_blackrocks"
        connection_type: "implicit"
  - location: "framtida Ghana/Solvinter"
    symbolic_function: >
      Möjlig post-work-miljö där AI, energi, utbildning och ekonomiska flöden
      är vardagliga och människovärde inte måste bevisas genom lönearbete.
    connections:
      - file: "notes/fragments/windey_bay_ii.yaml"
        fragment_id: "windey_bay_ii"
        connection_type: "explicit"
      - file: "story_bible/world/worldbuilding.yaml"
        fragment_id: null
        connection_type: "explicit"

characters_connected_to_theme:
  - character: "protagonisten"
    thematic_role: >
      Bär huvudbågen från yrkesidentitet till namnlöshet, institutionell
      passivisering, återkomst till arbete och senare skapandet av en modell
      där andra kan få värde före status.
    files:
      - "notes/fragments/upplosning"
      - "notes/fragments/vantrummet"
      - "story_bible/characters/protagonist.yaml"
  - character: "Marcus"
    thematic_role: >
      Representerar handens arbete, jord, tobak, frivillig ordning och en
      värdighet som inte behöver översättas till karriär.
    files:
      - "notes/fragments/faltet"
      - "notes/fragments/marcus_pipa"
  - character: "kvinnan i parken / vårdkvinnan"
    thematic_role: >
      Visar hur arbete, omsorg och social tillit kan förstöras när kropp,
      smärta, vård och försörjning faller isär.
    files:
      - "notes/fragments/parken"
      - "notes/fragments/vaxthuset"
  - character: "skepparen"
    thematic_role: >
      Praktiskt kunnande utan akademisk status; arbete som heder, tyst precision
      och social nytta.
    files:
      - "output/manus/anomaliernas_kosmologi_kortroman_lasutgava_v0_8.md"
      - "story_bible/recurring_details.yaml"
  - character: "Peta"
    thematic_role: >
      Hantverkets exakthet, ärlighet och byggmästarens lokala kunskap; en nod
      mellan estetisk funktion och ekonomiskt möjlig framtid.
    files:
      - "notes/fragments/mason_peta"
      - "notes/fragments/fathers_presence_blackrocks"
  - character: "Arvid"
    thematic_role: >
      Teknisk anomali: IT-kompetens, spel, musik, 3D-skrivare och utbrändhet.
      Visar både digital produktivitet och hur systemen kan förbruka den.
    files:
      - "output/manus/anomaliernas_kosmologi_kortroman_lasutgava_v0_8.md"
      - "notes/fragments/raw/i_vaxthusets_skymning_2"
  - character: "Eira/Lelo"
    thematic_role: >
      Bär universitet, kosmologi, anomalier, AI och framtidsblick; kan låta
      filosofin bli samtal snarare än essä.
    files:
      - "notes/fragments/eira"
      - "notes/fragments/raw/matematkprofessorn"
      - "notes/fragments/windey_bay_ii.yaml"
  - character: "fadern"
    thematic_role: >
      Status, egendom, äldre klassordning och konflikt kring vem som äger frukten
      av arbete.
    files:
      - "notes/fragments/fadern_blackrocks.yaml"
      - "notes/fragments/fathers_presence_blackrocks"
      - "notes/fragments/Relationen till fadern var mycket komple"
  - character: "brodern"
    thematic_role: >
      Ekonomins nödvändighet: idéer behöver kapital, institutioner och en modell
      som låter arbete fortsätta tillräckligt länge för att skapa verkligt värde.
    files:
      - "manuscript/fragments/solvinter-brodern-ekonomi.md"
      - "notes/fragments/solvinter_ekonomi_brodern.md"
  - character: "dottern / dotterns dotter"
    thematic_role: >
      Framtidens sokratiska mottagare: kan bära frågan om hemligheter, värde,
      sjukdom, arbete och varför tidigare epoker organiserade värdighet kring
      produktivitet.
    files:
      - "notes/fragments/samtal_med_dotter"
      - "notes/fragments/samtal_med_dottern_om_sjukdom"

