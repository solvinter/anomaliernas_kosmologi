tensions:
  - tension: "arbete som räddning kontra arbete som förbrukning"
    material: "Återgången till läkararbete ger värdighet, men vårdkvinnans liv visar arbete som kroppslig förbrukning."
  - tension: "närvaro som värde kontra närvaro som övervakning"
    material: "Fältets valuta och proof of vitality vill se det osedda men riskerar att mäta människan för hårt."
  - tension: "AI som frigörelse kontra AI som ny arbetsmarknad"
    material: "Solvinter vill skapa frihet och lokal kompetens men är också beroende av globalt AI-arbete och ekonomiska beställare."
  - tension: "bidrag som stigma kontra bidrag som socialt basvärde"
    material: "Försörjningsstöd markerar marginalitet i Fältet, men omformas i senare fragment till grundflöde."
  - tension: "status genom yrke kontra värde genom praktisk kunskap"
    material: "Läkaren har formell status; Skepparen, Peta och Arvid har kompetens som ofta saknar social översättning."
  - tension: "förmögen fritid kontra arbetslös fritid"
    material: "Likviditet ger framtidshorisont, medan arbetslöshetens tid på gatan och efter sjukhuset blir skam och väntan."
  - tension: "ekonomisk framgång kontra romanens lågmälda etik"
    material: "Solvinter kan bli mycket framgångsrikt, men berättelsen fungerar bäst när pengar blir möjliggörare och inte triumftal."

contradictions:
  - contradiction: "Fältet är både plats för frihet och plats för människor som placerats utanför."
    significance: "Gör Fältet litterärt starkare: det är inte idyll, utan en dubbel plats."
  - contradiction: "Institutionen skadar genom passivitet men räddar genom struktur."
    significance: "Sjukhuset kan inte reduceras till fiende; vården ger skydd, men också förlust av autonomi."
  - contradiction: "Yrket är både en falsk identitet och en nödvändig återkomst."
    significance: "Läkaryrket bör inte strykas ned till statuskritik; det är också ansvar och etisk praktik."
  - contradiction: "Pengar kritiseras men behövs."
    significance: "Broderfragmentet och Solvinter-ekonomin visar att idéer dör utan ekonomi."
  - contradiction: "Automation kan minska mänsklig nödvändighet men kräver mer mänsklig kompetens i början."
    significance: "Materialet motsäger enkla post-work-slutsatser."
  - contradiction: "Att mäta närvaro kan synliggöra värde men också skapa ett nytt kontrollsystem."
    significance: "Proof of vitality bör bära en etisk skugga om det används."

