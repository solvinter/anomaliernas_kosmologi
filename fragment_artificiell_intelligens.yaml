title: Varför kallade ni det artificiell intelligens?
book: Anomaliernas kosmologi
part: III
chapter: Fragment

characters:
  - Protagonisten
  - Lelo
  - Flickan

location:
  Solvinterhuset

setting:
  Ett ljust kök som öppnar sig mot en trädgård. Teknologin finns
  överallt men syns nästan inte längre. Redskap formas ur
  arbetsytorna när de behövs och återgår sedan till samma material.

purpose:
  - Undersöka ordet "artificiell".
  - Visa Lelos världsbild.
  - Låta protagonisten minnas istället för att föreläsa.
  - Förmedla att teknologin blivit en del av naturen.

theme:
  Människan skapade aldrig något utanför naturen.
  Det artificiella var ett historiskt sätt att beskriva sådant
  som ännu inte uppfattades som en del av naturens fortsatta utveckling.

text: |

  De stod i köket.

  Eller kök var kanske fel ord.

  Rummet hade fortfarande ett bord, några stolar och ett stort fönster
  mot trädgården, men de flesta redskap syntes inte längre. När de
  behövdes växte de långsamt fram ur arbetsytan och drog sig tillbaka
  igen när arbetet var färdigt.

  Flickan lade ett äpple på bänken.

  Frukten delades långsamt i tunna skivor utan att någon maskin syntes.

  Hon tittade på dem båda.

  "Farfar?"

  "Ja?"

  "Varför kallade ni det artificiell intelligens?"

  Han log.

  "Det där ordet använde vi hela tiden."

  "Men varför?"

  Han öppnade munnen.

  Sedan stängde han den igen.

  "Jag tror..." sade han långsamt.

  "Nej."

  Lelo log vänligt.

  "Hon frågade inte vad ni byggde."

  Protagonisten skrattade.

  "Nej... det gjorde hon faktiskt inte."

  Flickan såg mellan dem.

  "Jag frågade varför ni kallade den artificiell."

  Lelo tog upp ett litet frö från bordet.

  "Vad är det här?"

  "Ett frö."

  "Har någon tillverkat det?"

  "Nej."

  "Är du säker?"

  Flickan funderade.

  "Trädet gjorde det."

  "Och vem gjorde trädet?"

  "Det växte."

  "Ur vad?"

  "Ur ett annat frö."

  Lelo nickade.

  "Ser du?"

  "Naturen tillverkar också."

  Protagonisten log.

  "Vi brukade nog tänka att naturen skapade och människan tillverkade."

  Lelo såg på honom.

  "Det var där ni gick vilse."

  Han skrattade.

  "Vilse?"

  "Ni sa människa och natur."

  Han blev tyst.

  "Ja..."

  "Som om människan inte redan var natur."

  Flickan pekade ut genom fönstret.

  "Är ett fågelbo teknologi?"

  "Ja."

  "En bikupa?"

  "Ja."

  "En bäverdamm?"

  "Ja."

  "En bok?"

  Protagonisten tog upp den slitna volymen som låg på bordet.

  Alice i Underlandet.

  Han drog handen över omslaget.

  "Den här brukade vi kalla en bok."

  "Är den artificiell?"

  Han svarade inte.

  Lelo gjorde det.

  "Pappret kommer från träd."

  "Berättelsen kommer från en människa."

  "Människan kommer från naturen."

  "Minnet kommer från livet."

  "Vilken del är artificiell?"

  Ingen sade något.

  Vinden rörde trädkronorna.

  Fåglarna fortsatte mellan grenarna.

  Efter en stund sade protagonisten:

  "Jag tror att vi kallade intelligensen artificiell därför att den bodde
  i maskiner."

  Lelo nickade.

  "Era första maskiner såg ut som anomalier."

  "De fyllde hela rum."

  "Sedan stod de som stora lådor i era hem."

  "Ni såg dem som något utanför naturen."

  "Därför trodde ni också att intelligensen där inne måste vara av ett
  annat slag."

  Flickan såg på henne.

  "Men det var den inte?"

  Lelo log.

  "Nej."

  "Teknologin började inte med människan."

  "Den började när livet lärde sig använda världen."

  Protagonisten såg ut över trädgården.

  Små pollinerare rörde sig mellan blommorna.

  Han visste inte längre vilka som härstammade från bin och vilka som
  en gång hade konstruerats av människor.

  Och för första gången slog det honom att frågan inte längre hade någon
  betydelse.

  Flickan bröt tystnaden.

  "Vad kallar ni det nu?"

  Lelo log.

  "Vi kallar det bara intelligens."

